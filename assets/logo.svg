<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Consilium mark: three nodes deliberating into one decision point.
       Three analysts (outer ring) connect to a central arbiter (risk manager). -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a48bff"/>
      <stop offset="100%" stop-color="#6b4eff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#grad)"/>

  <!-- Edges connecting three analysts to the central node -->
  <g stroke="white" stroke-width="1.6" stroke-linecap="round" opacity="0.55">
    <line x1="20" y1="22" x2="32" y2="36"/>
    <line x1="44" y1="22" x2="32" y2="36"/>
    <line x1="32" y1="48" x2="32" y2="36"/>
  </g>

  <!-- Three analyst nodes -->
  <g fill="white" filter="url(#glow)">
    <circle cx="20" cy="22" r="3.2"/>
    <circle cx="44" cy="22" r="3.2"/>
    <circle cx="32" cy="48" r="3.2"/>
  </g>

  <!-- Central decision node (larger, brighter) -->
  <circle cx="32" cy="36" r="4.6" fill="white" filter="url(#glow)"/>
  <circle cx="32" cy="36" r="2.2" fill="#6b4eff"/>
</svg>
