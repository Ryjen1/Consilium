<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" fill="none">
  <!--
    Consilium horizontal lockup (v2) — light-background variant. Wordmark
    rendered in #0a0d18. Mark keeps its gradient because the purple reads
    well on white and light grey surfaces.
  -->
  <defs>
    <linearGradient id="cns-g" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a48bff"/>
      <stop offset="100%" stop-color="#6a4aff"/>
    </linearGradient>
  </defs>

  <g transform="translate(4 4)">
    <path d="M26 16a10 10 0 1 0-5 8.66"
          stroke="url(#cns-g)" stroke-width="1.75" stroke-linecap="round" fill="none"/>
    <circle cx="7.6"  cy="11.3" r="2" fill="url(#cns-g)"/>
    <circle cx="7.6"  cy="20.7" r="2" fill="url(#cns-g)"/>
    <circle cx="14"   cy="5.3"  r="2" fill="url(#cns-g)"/>
    <path d="M9.2 12L14.5 15.2M9.2 20L14.5 16.8M15 6.8L15.4 14.2"
          stroke="url(#cns-g)" stroke-width="1.25" stroke-linecap="round" opacity="0.55"/>
    <circle cx="16" cy="16" r="3.2" fill="url(#cns-g)"/>
    <circle cx="16" cy="16" r="1.2" fill="#ffffff"/>
  </g>

  <text x="46" y="26"
        font-family="Inter, 'SF Pro Display', -apple-system, system-ui, sans-serif"
        font-size="20" font-weight="600" letter-spacing="-0.4"
        fill="#0a0d18">Consilium</text>
</svg>
