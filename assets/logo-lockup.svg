<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" fill="none">
  <!--
    Consilium horizontal lockup (v2). Mark + wordmark in one file. Use on
    the landing header, README hero, social cards. Dark-first — place on
    #0a0d18 or similar. For light backgrounds, use logo-lockup-light.svg.
  -->
  <defs>
    <linearGradient id="cns-g" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a48bff"/>
      <stop offset="100%" stop-color="#6a4aff"/>
    </linearGradient>
    <radialGradient id="cns-r" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a48bff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a48bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Mark (scaled to 40x40 in the 220x40 box, anchored left) -->
  <g transform="translate(4 4) scale(1)">
    <circle cx="16" cy="16" r="15" fill="url(#cns-r)"/>
    <path d="M26 16a10 10 0 1 0-5 8.66"
          stroke="url(#cns-g)" stroke-width="1.75" stroke-linecap="round" fill="none"/>
    <circle cx="7.6"  cy="11.3" r="2" fill="url(#cns-g)"/>
    <circle cx="7.6"  cy="20.7" r="2" fill="url(#cns-g)"/>
    <circle cx="14"   cy="5.3"  r="2" fill="url(#cns-g)"/>
    <path d="M9.2 12L14.5 15.2M9.2 20L14.5 16.8M15 6.8L15.4 14.2"
          stroke="url(#cns-g)" stroke-width="1.25" stroke-linecap="round" opacity="0.55"/>
    <circle cx="16" cy="16" r="3.2" fill="#ffffff"/>
    <circle cx="16" cy="16" r="3.2" fill="url(#cns-g)" opacity="0.9"/>
    <circle cx="16" cy="16" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Wordmark. Uses Inter-like system stack; if you embed Inter via CSS
       or convert to outlines, the rendering is pixel-identical. -->
  <text x="46" y="26"
        font-family="Inter, 'SF Pro Display', -apple-system, system-ui, sans-serif"
        font-size="20" font-weight="600" letter-spacing="-0.4"
        fill="#e5e7eb">Consilium</text>
</svg>
